services:
  preparar_diretorios:
    build:
      context: .
      dockerfile: Dockerfile
    image: ojuara:latest
    user: "0:0"
    command:
      - python
      - -c
      - >-
        import os;
        [os.chown(caminho, 10001, 10001) for caminho in ('/app/data', '/app/backups')];
        [os.chmod(caminho, 0o750) for caminho in ('/app/data', '/app/backups')]
    volumes:
      - ${OJUARA_DATA_DIR:-/opt/ojuara/data}:/app/data
      - ${OJUARA_BACKUP_DIR:-/opt/ojuara/backups}:/app/backups
    network_mode: none
    restart: "no"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER

  ojuara:
    build:
      context: .
      dockerfile: Dockerfile
    image: ojuara:latest
    restart: unless-stopped
    init: true
    depends_on:
      preparar_diretorios:
        condition: service_completed_successfully
    environment:
      OJUARA_AMBIENTE: producao
      OJUARA_SEED: "0"
      OJUARA_HOST: 0.0.0.0
      OJUARA_PORTA: "5000"
      OJUARA_DATABASE: /app/data/ojuara.db
      OJUARA_SECRET_KEY: ${OJUARA_SECRET_KEY:?configure OJUARA_SECRET_KEY}
      OJUARA_SUPERADMIN: ${OJUARA_SUPERADMIN:-superadmin}
      OJUARA_SUPERADMIN_SENHA: ${OJUARA_SUPERADMIN_SENHA:?configure OJUARA_SUPERADMIN_SENHA}
    volumes:
      - ${OJUARA_DATA_DIR:-/opt/ojuara/data}:/app/data
    expose:
      - "5000"
    networks:
      - proxy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/saude', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backup:
    image: ojuara:latest
    restart: unless-stopped
    init: true
    depends_on:
      ojuara:
        condition: service_healthy
    command: ["python", "scripts/backup_continuo.py"]
    network_mode: none
    environment:
      OJUARA_DATABASE: /app/data/ojuara.db
      OJUARA_BACKUP_DIR: /app/backups
      OJUARA_BACKUP_RETENCAO_DIAS: "30"
      OJUARA_BACKUP_INTERVALO_SEGUNDOS: "86400"
    volumes:
      - ${OJUARA_DATA_DIR:-/opt/ojuara/data}:/app/data:ro
      - ${OJUARA_BACKUP_DIR:-/opt/ojuara/backups}:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
    name: ${NPM_NETWORK:-nginx-proxy_default}
