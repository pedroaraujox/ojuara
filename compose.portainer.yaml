services:
  preparar_diretorios:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${OJUARA_IMAGE_NAME:?Defina OJUARA_IMAGE_NAME}:local
    user: "0:0"
    command:
      - python
      - -c
      - >-
        import os;
        [os.chown(caminho, 10001, 10001) for caminho in ('/app/data', '/app/backups')];
        [os.chmod(caminho, 0o750) for caminho in ('/app/data', '/app/backups')]
    volumes:
      - ${OJUARA_DATA_DIR:?Defina OJUARA_DATA_DIR}:/app/data
      - ${OJUARA_BACKUP_DIR:?Defina OJUARA_BACKUP_DIR}:/app/backups
    network_mode: none
    restart: "no"
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${OJUARA_IMAGE_NAME:?Defina OJUARA_IMAGE_NAME}:local
    container_name: ${OJUARA_CONTAINER_NAME:?Defina OJUARA_CONTAINER_NAME}
    restart: unless-stopped
    init: true
    depends_on:
      preparar_diretorios:
        condition: service_completed_successfully
    environment:
      OJUARA_AMBIENTE: producao
      OJUARA_HTTPS: "1"
      OJUARA_PROXY_CONFIAVEL: "1"
      OJUARA_SEED: "0"
      OJUARA_HOST: 0.0.0.0
      OJUARA_PORTA: "5000"
      OJUARA_DATABASE: /app/data/ojuara.db
      OJUARA_SECRET_KEY: ${OJUARA_SECRET_KEY:?Defina OJUARA_SECRET_KEY}
      OJUARA_SUPERADMIN: ${OJUARA_SUPERADMIN:-superadmin}
      OJUARA_SUPERADMIN_SENHA: ${OJUARA_SUPERADMIN_SENHA:?Defina OJUARA_SUPERADMIN_SENHA}
    expose:
      - "5000"
    networks:
      - interna
      - proxy
    volumes:
      - ${OJUARA_DATA_DIR:?Defina OJUARA_DATA_DIR}:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/saude', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  backup:
    image: ${OJUARA_IMAGE_NAME:?Defina OJUARA_IMAGE_NAME}:local
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    command: [python, scripts/backup_continuo.py]
    network_mode: none
    environment:
      OJUARA_DATABASE: /app/data/ojuara.db
      OJUARA_BACKUP_DIR: /app/backups
      OJUARA_BACKUP_RETENCAO_DIAS: ${OJUARA_BACKUP_RETENCAO_DIAS:-30}
      OJUARA_BACKUP_INTERVALO_SEGUNDOS: ${OJUARA_BACKUP_INTERVALO_SEGUNDOS:-86400}
    volumes:
      - ${OJUARA_DATA_DIR:?Defina OJUARA_DATA_DIR}:/app/data:ro
      - ${OJUARA_BACKUP_DIR:?Defina OJUARA_BACKUP_DIR}:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  interna:
    internal: true
  proxy:
    external: true
    name: ${NPM_NETWORK:-nginx-proxy_default}
