{% extends "base.html" %}
{% block titulo %}Erro {{ codigo }}{% endblock %}
{% block cabecalho %}Erro {{ codigo }}{% endblock %}

{% block conteudo %}
<div class="card">
  <div class="card-body text-center py-5">
    <i class="bi bi-emoji-frown display-4 text-secondary"></i>
    <h2 class="h4 mt-3">{{ mensagem }}</h2>
    <p class="text-secondary">{{ detalhe }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-marca">
      <i class="bi bi-house me-1"></i>Voltar ao painel
    </a>
  </div>
</div>
{% endblock %}
